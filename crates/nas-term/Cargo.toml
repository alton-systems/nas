[package]
name = "nas-term"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nas"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
base64 = "0.23.1"
nas-config = { path = "../nas-config" }
nas-editor = { path = "../nas-editor" }
nas-history = { path = "../nas-history" }
nas-keys = { path = "../nas-keys" }
nas-mcp = { path = "../nas-mcp" }
nucleo = "0.5.0"
ratatui = "0.29.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
insta = "1.49.0"
nas-commands = { path = "../nas-commands" }
serde_json = "1"
tempfile = "3.27.0"
