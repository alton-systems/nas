# Atalhos do nas. A partir do redesenho "teclas como ideogramas", a
# especificação vive em docs/keys.md — este arquivo é a implementação
# dela em dados, não o contrário. Veja lá a ideia central (radicais e
# compostos), as regras, as classes e a tabela completa de teclas.
#
# Teclas são escritas por posição física no teclado US qwerty,
# independente do layout físico real do usuário — ver
# crates/nas-keys/src/layout.rs.
#
# Formato de uma tecla: um caractere ("j", ";", "g"), ou um destes
# nomes: SPC, RET, ESC, DEL, TAB, <left>, <right>, <up>, <down>; com o
# prefixo "M-" para Alt (ex.: "M-SPC").
#
# Valor de uma tecla, em [insert]/[visual]/[prefixes.*]:
#   - uma string: o nome de uma ação (ver [commands]), ou
#     "enter-insert" / "enter-visual" / "enter-sequential" / "repeat";
#   - { prefix = "NOME" }: entra no prefixo NOME, que espera mais uma
#     tecla — ver a tabela [prefixes.NOME];
#   - { verb = "delete" | "copy" | "cut" }: entra no verbo, que espera
#     um objeto (ver [objects.*] abaixo) — docs/keys.md §4.2 e §4.3;
#   - { unit = "word" | "paragraph" }: entra na unidade, que espera uma
#     direção — ver [objects.word]/[objects.paragraph] e docs/keys.md §4.1.
#
# Os objetos horizontais e verticais que um verbo aceita (movimento por
# caractere e por linha) não são declarados aqui — são derivados direto
# das ações de movimento já ligadas em [visual] (cada ação sabe se é
# horizontal ou vertical, em machine.rs). Mudar a tecla de um movimento
# acima muda o objeto correspondente automaticamente. [objects.word] e
# [objects.paragraph] são também usados tanto por uma unidade sozinha
# (movimento puro) quanto por um verbo seguido da unidade (ex.:
# "d w ;"); [objects.whole] é o arquivo inteiro (tecla "a"). O objeto
# "linha atual" (verbo repetido, ex. "d d") não é dado — é a própria
# gramática do verbo, em machine.rs.
#
# [system] são os atalhos da classe sistema (Ctrl + tecla), válidos em
# qualquer estado — nunca interceptados pela máquina modal.
#
# [commands] dá uma descrição curta pra cada nome de ação/verbo/unidade/
# prefixo/objeto/comando de sistema, usada pelas dicas que o nas-term
# mostra na barra de status enquanto um verbo, prefixo ou unidade está
# pendente.

[insert]
"M-SPC" = "enter-visual"

[visual]
RET = "enter-insert"
"M-SPC" = "enter-insert"

# Navegação por caractere/linha (j k l ; = esquerda baixo cima direita)
j = "move-left"
k = "move-down"
l = "move-up"
";" = "move-right"

# Navegação — extremos (Shift = intensidade máxima)
J = "move-line-start"
":" = "move-line-end"
L = "move-buffer-start"
K = "move-buffer-end"

# Desfazer
u = "undo"

# Seleção e área de transferência
s = "start-selection"
S = "select-all"
y = "paste"

# Verbos (esperam um objeto — ver [objects.*]) e unidades (esperam uma
# direção — ver [objects.word]/[objects.paragraph]). Shift intensifica
# a unidade também (regra 3): w = palavra, W = parágrafo, uma escala
# maior. "p" fica reservado (ver docs/keys.md §6).
d = { verb = "delete" }
c = { verb = "copy" }
x = { verb = "cut" }
w = { unit = "word" }
W = { unit = "paragraph" }

# Repetir o último composto que alterou o texto
"." = "repeat"

# Prefixos
g = { prefix = "go" }
SPC = { prefix = "leader" }

[prefixes.go]
g = "move-buffer-start"
l = "prompt-goto-line"
# "c" (ir para uma posição em caracteres) e "f" (ir para a definição de
# uma função, via LSP) ficam reservados — ver docs/keys.md §4.9.

[prefixes.leader]
SPC = "enter-sequential"
f = "prompt-search"
# "r" (substituir) e "h" (ajuda) ficam de fora por ora: substituir
# precisa de um fluxo interativo de confirmação por ocorrência que
# ainda não existe, e ajuda não tem pra onde apontar ainda — ver
# docs/keys.md §5 (o que não implementamos).

[objects.word]
j = "word-backward"
";" = "word-forward"

[objects.paragraph]
k = "paragraph-forward"
l = "paragraph-backward"

[objects.whole]
a = "whole-buffer"

[system]
s = "save"
q = "quit"
o = "open-file"
b = "switch-buffer"
k = "close-buffer"
r = "reload-buffer"
t = { prefix = "tempo" }

[system_prefixes.tempo]
n = "checkpoint-new"
l = "checkpoint-list"
e = "checkpoint-diff"
r = "checkpoint-restore"
a = "checkpoint-blame"
z = "history-delete"

[commands]
move-left = "caractere anterior"
move-right = "próximo caractere"
move-down = "linha abaixo"
move-up = "linha acima"
move-line-start = "início da linha"
move-line-end = "fim da linha"
move-buffer-start = "início do arquivo"
move-buffer-end = "fim do arquivo"
move-word-backward = "palavra anterior"
move-word-forward = "próxima palavra"
move-paragraph-forward = "próximo parágrafo"
move-paragraph-backward = "parágrafo anterior"
undo = "desfazer"
start-selection = "marcar seleção"
select-all = "selecionar tudo"
paste = "colar"
repeat = "repetir o último comando que alterou o texto"
prompt-search = "buscar"
prompt-goto-line = "ir para uma linha"
enter-sequential = "modo sequencial"
delete = "apagar"
copy = "copiar"
cut = "recortar"
word = "palavra"
paragraph = "parágrafo"
go = "ir para"
