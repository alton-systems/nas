# Atalhos do nas, espelhando nas-map.el (https://github.com/2gab/nas-keys).
#
# Teclas são escritas por posição física no teclado US qwerty,
# independente do layout físico real do usuário — ver
# crates/nas-keys/src/layout.rs (e nas-layout.el no nas-keys).
#
# Formato de uma tecla: um caractere ("j", ";", "g"), ou um destes
# nomes: SPC, RET, ESC, DEL, TAB, <left>, <right>, <up>, <down>; com o
# prefixo "M-" para Alt (ex.: "M-SPC").
#
# Valor de uma tecla:
#   - uma string: o nome de uma ação, ou "enter-insert" / "enter-visual"
#     / "enter-sequential";
#   - { prefix = "NOME" }: entra no prefixo NOME, que espera mais uma
#     tecla — ver a tabela [prefixes.NOME];
#   - { dispatch = "NOME" }: entra no despacho NOME, que também espera
#     mais uma tecla, mas com uma ação de "fallback" se a tecla não for
#     uma das suas — ver a tabela [dispatches.NOME].
#
# Escopo desta etapa (marco 1, etapa 5b): seleção e área de
# transferência já têm ação. Trocar de buffer e janelas ainda não têm
# ação correspondente (etapa 5c e além).

[insert]
"M-SPC" = "enter-visual"

[visual]
RET = "enter-insert"
"M-SPC" = "enter-insert"

# Navegação por caractere/linha (j k l ; = esquerda baixo cima direita)
j = "move-left"
k = "move-down"
l = "move-up"
";" = "move-right"

# Navegação — extremos (Shift = máxima potência)
J = "move-line-start"
":" = "move-line-end"
L = "move-buffer-start"
K = "move-buffer-end"

# Desfazer
u = "undo"

# Abrir arquivo
o = "prompt-open-file"

# Seleção e área de transferência
s = "start-selection"
S = "select-all"
c = "copy"
x = "cut"
y = "paste"

# Prefixos e despacho
g = { prefix = "go" }
SPC = { prefix = "leader" }
d = { dispatch = "delete" }

[prefixes.go]
g = "move-buffer-start"

[prefixes.leader]
SPC = "enter-sequential"
f = "prompt-search"

[dispatches.delete]
fallback = "delete-forward"
d = "delete-forward"
";" = "delete-forward"
j = "delete-backward"
